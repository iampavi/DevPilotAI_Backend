version: '3.8'

services:
  devpilot-api:
    image: devpilot-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5199:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - QdrantSettings__Host=qdrant
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=DevPilotAI;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: devpilot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
